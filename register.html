<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - VN-Mod-Minecraft</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 10px; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; }
        h2 { color: #ff9800; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #444; background: #2c2c2c; color: #fff; border-radius: 5px; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 12px; background: #ff9800; border: none; color: #fff; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; font-size: 16px; }
        button:hover { background: #e68900; }
        p { margin-top: 15px; font-size: 14px; color: #aaa; }
        a { color: #ff9800; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Đăng Ký Tài Khoản</h2>
    <input type="email" id="reg-email" placeholder="Nhập Email">
    <input type="password" id="reg-password" placeholder="Nhập Mật khẩu (ít nhất 6 ký tự)">
    <button onclick="handleRegister()">Tạo tài khoản</button>
    <p>Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDJ8NUX7ulkcM64DdSF-2JfWVBCzMxv0",
        authDomain: "vn-mod-minecraft.firebaseapp.com",
        projectId: "vn-mod-minecraft",
        storageBucket: "vn-mod-minecraft.firebasestorage.app",
        messagingSenderId: "637138266298",
        appId: "1:637138266298:web:756973163c7b608d99ba83",
        measurementId: "G-B89EQQ4RQW"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.handleRegister = function() {
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;

        if(!email || !password) {
            alert("Vui lòng nhập đầy đủ Email và Mật khẩu!");
            return;
        }

        createUserWithEmailAndPassword(auth, email, password)
            .then((userCredential) => {
                alert("Đăng ký thành công!");
                window.location.href = "login.html";
            })
            .catch((error) => {
                alert("Lỗi đăng ký: " + error.message);
            });
    }
</script>

</body>
</html>
